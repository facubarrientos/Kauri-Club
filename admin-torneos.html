<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Torneos - KAURI CLUB</title>

    <link 
        rel="stylesheet" 
        href="css/style.css"
    >

</head>

<body>

    <header>

        <div class="logo-titulo">

            <img 
                src="./img/kauri_logo.png" 
                width="120"
            >

            <h1>ADMIN TORNEOS</h1>

        </div>

    </header>

    <main class="admin-partidos">

        <div class="admin-top">

            <a href="admin.html" class="btn-volver">
                ← Volver
            </a>

            <h2>Gestión de Torneos</h2>

        </div>

        <section class="form-partido-box">

            <h2>Agregar Torneo</h2>

            <form id="form-torneo">

                <input 
                    type="text"
                    id="nombre-torneo"
                    placeholder="Nombre del torneo"
                    required
                >

                <input 
                    type="date"
                    id="fecha-torneo"
                    required
                >

                <select id="estado-torneo">

                    <option value="Activo">
                        Activo
                    </option>

                    <option value="Finalizado">
                        Finalizado
                    </option>

                </select>

                <button type="submit">
                    Guardar Torneo
                </button>

            </form>

        </section>

        <section class="lista-partidos-box">

            <h2>Lista de Torneos</h2>

            <div class="tabla-admin-container">

                <table class="tabla-admin">

                    <thead>

                        <tr>

                            <th>Nombre</th>
                            <th>Fecha Inicio</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tabla-admin-torneos">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="datos.js"></script>
    <script src="script.js"></script>

</body>

</html>
