<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Torneos - KAURI CLUB</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body class="admin-body">

    <header class="admin-header">

        <div class="admin-logo-box">

            <img 
                src="./img/kauri_logo.png" 
                class="admin-logo"
            >

            <div>
                <h1>ADMIN TORNEOS</h1>
                <p>KAURI CLUB</p>
            </div>

        </div>

    </header>

    <main class="admin-partidos">

        <div class="admin-top">

            <a href="admin.html" class="btn-volver">
                ← Volver
            </a>

        </div>

        <section class="form-partido-box">

            <h2>Agregar Torneo</h2>

            <form id="form-torneo">

                <input 
                    type="text"
                    id="nombre-torneo"
                    placeholder="Nombre del torneo"
                    required
                >

                <input 
                    type="date"
                    id="fecha-torneo"
                    required
                >

                <select id="formato-torneo" required>
                    <option value="largo">Largo</option>
                    <option value="corto">Corto</option>
                </select>

                <select id="estado-torneo">

                    <option value="Activo">
                        Activo
                    </option>

                    <option value="Finalizado">
                        Finalizado
                    </option>

                </select>

                <button type="submit">
                    Guardar Torneo
                </button>

            </form>

        </section>

        <section class="lista-partidos-box">

            <h2>Lista de Torneos</h2>

            <div class="tabla-admin-container">

                <table class="tabla-admin">

                    <thead>

                        <tr>
                            <th>Nombre</th>
                            <th>Fecha Inicio</th>
                            <th>Formato</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tabla-admin-torneos"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="datos.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
