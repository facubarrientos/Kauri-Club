<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin | KAURI CLUB</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>
    
    <main class="login-admin">

        <form id="form-login">

            <h2>KAURI CLUB</h2>

            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
            >

            <button type="submit">
                Ingresar
            </button>

        </form>

    </main>

    <script type="module" src="script.js"></script>

</body>

</html>
