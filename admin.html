<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | KAURI CLUB</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body class="admin-body">

    <header class="admin-header">
        <div class="admin-logo-box">
            <img src="./img/kauri_logo.png" class="admin-logo">

            <div>
                <h1>PANEL ADMINISTRATIVO</h1>
                <p>KAURI CLUB</p>
            </div>
        </div>
    </header>

    <main class="admin-panel">

        <h2>Bienvenido, Lauchi.</h2>
        <p class="admin-subtitulo">
            Gestioná jugadores, partidos y torneos del club.
        </p>

        <div class="admin-cards">

            <a href="admin-jugadores.html" class="admin-card">
                <i class="fa-solid fa-users"></i>
                <h3>Jugadores</h3>
                <p>Agregar, editar y administrar jugadores del club.</p>
            </a>

            <a href="admin-partidos.html" class="admin-card">
                <i class="fa-solid fa-calendar-days"></i>
                <h3>Partidos</h3>
                <p>Crear partidos, horarios y cargar resultados.</p>
            </a>

            <a href="admin-torneos.html" class="admin-card">
                <i class="fa-solid fa-trophy"></i>
                <h3>Torneos</h3>
                <p>Crear y gestionar torneos del club.</p>
            </a>

            <button class="btn-cerrar-admin" onclick="cerrarSesion()">
                Cerrar sesión
            </button>

        </div>

    </main>

    <script src="datos.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
