<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Partidos - KAURI CLUB</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="admin-body">

    <header class="admin-header">

        <div class="admin-logo-box">

            <img 
                src="./img/kauri_logo.png" 
                class="admin-logo"
            >

            <div>
                <h1>ADMIN PARTIDOS</h1>
                <p>KAURI CLUB</p>
            </div>

        </div>

    </header>

    <main class="admin-partidos">

        <div class="admin-top">

            <a href="admin.html" class="btn-volver">
                ← Volver
            </a>

        </div>

        <section class="form-partido-box">

            <h2>Agregar Partido</h2>

            <form id="form-partido">

                <select id="tipo-partido" required>
                    <option value="torneo">Partido de torneo</option>
                    <option value="desafio">Partido desafío</option>
                </select>

                <select id="instancia-partido" required>
                    <option value="desafio">Desafío</option>
                    <option value="fase de grupos">Fase de grupos</option>
                    <option value="octavos">Octavos</option>
                    <option value="cuartos">Cuartos</option>
                    <option value="semifinal">Semifinal</option>
                    <option value="final">Final</option>
                </select>

                <select 
                    id="torneo-partido" 
                    required
                >
                </select>

                <select 
                    id="jugador1-partido" 
                    required
                >
                </select>

                <select 
                    id="jugador2-partido" 
                    required
                >
                </select>

                <input 
                    type="date" 
                    id="fecha-partido" 
                    required
                >

                <input 
                    type="time" 
                    id="hora-partido" 
                    required
                >

                <input 
                    type="text" 
                    id="cancha-partido"
                    placeholder="Cancha"
                    required
                >

                <input 
                    type="number" 
                    id="set1-jugador1" 
                    placeholder="Puntos Set 1 J1"
                >

                <input 
                    type="number" 
                    id="set1-jugador2" 
                    placeholder="Puntos Set 1 J2"
                >

                <input 
                    type="number" 
                    id="set2-jugador1" 
                    placeholder="Puntos Set 2 J1"
                >

                <input 
                    type="number" 
                    id="set2-jugador2" 
                    placeholder="Puntos Set 2 J2"
                >

                <input 
                    type="number" 
                    id="set3-jugador1" 
                    placeholder="Puntos Set 3 J1"
                >

                <input 
                    type="number" 
                    id="set3-jugador2" 
                    placeholder="Puntos Set 3 J2"
                >

                <select id="estado-partido">

                    <option value="pendiente">
                        Pendiente
                    </option>

                    <option value="finalizado">
                        Finalizado
                    </option>

                </select>

                <button type="submit">
                    Guardar Partido
                </button>

            </form>

        </section>

        <section class="lista-partidos-box">

            <h2>Lista de Partidos</h2>

            <div class="tabla-admin-container">

                <table class="tabla-admin">

                    <thead>

                        <tr>
                            <th>Tipo</th>
                            <th>Instancia</th>
                            <th>Jugador 1</th>
                            <th>Jugador 2</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Cancha</th>
                            <th>Estado</th>
                            <th>Resultado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tabla-admin-partidos">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="datos.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
