<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Partidos - KAURI CLUB</title>

    <link 
        rel="stylesheet" 
        href="css/style.css"
    >

</head>

<body>

    <header>

        <div class="logo-titulo">

            <img 
                src="./img/kauri_logo.png" 
                width="120"
            >

            <h1>ADMIN PARTIDOS</h1>

        </div>

    </header>

    <main class="admin-partidos">

        <div class="admin-top">

            <a href="admin.html" class="btn-volver">
                ← Volver
            </a>

            <h2>Gestión de Partidos</h2>

        </div>

        <section class="form-partido-box">

            <h2>Agregar Partido</h2>

            <form id="form-partido">

                <select 
                    id="torneo-partido" 
                    required
                >
                </select>

                <select 
                    id="jugador1-partido" 
                    required
                >
                </select>

                <select 
                    id="jugador2-partido" 
                    required
                >
                </select>

                <input 
                    type="date" 
                    id="fecha-partido" 
                    required
                >

                <input 
                    type="time" 
                    id="hora-partido" 
                    required
                >

                <input 
                    type="text" 
                    id="cancha-partido"
                    placeholder="Cancha"
                    required
                >

                <button type="submit">
                    Guardar Partido
                </button>

            </form>

        </section>

        <section class="lista-partidos-box">

            <h2>Lista de Partidos</h2>

            <div class="tabla-admin-container">

                <table class="tabla-admin">

                    <thead>

                        <tr>

                            <th>Torneo</th>
                            <th>Jugador 1</th>
                            <th>Jugador 2</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Cancha</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tabla-admin-partidos">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="datos.js"></script>
    <script src="script.js"></script>

</body>

</html>
